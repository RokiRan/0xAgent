<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Harness - Web Console</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --radius: 6px;
      --font-mono: 'SF Mono', Monaco, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
    }

    .app.sidebar-hidden {
      grid-template-columns: 0 1fr;
    }

    /* display:none removes .sidebar from grid auto-placement, which would
       shift .main into the 0-width first track — pin both explicitly. */
    .sidebar { grid-column: 1; }
    .main { grid-column: 2; }

    .app.sidebar-hidden .sidebar {
      display: none;
    }

    .sidebar-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius);
      padding: 4px 10px;
      cursor: pointer;
      font-size: 14px;
      align-self: center;
    }

    .sidebar-toggle:hover { color: var(--accent); border-color: var(--accent); }

    /* Sidebar */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header .status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    .sidebar-header .status.disconnected {
      background: var(--danger);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .new-thread-btn {
      margin: 12px 16px;
      padding: 8px 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .new-thread-btn:hover { background: var(--accent-hover); }

    .thread-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px;
    }

    .thread-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .thread-item:hover { background: var(--bg-tertiary); }
    .thread-item.active { background: var(--bg-tertiary); border-left: 2px solid var(--accent); }
    .thread-item .icon { font-size: 12px; opacity: 0.6; }
    .thread-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-item .time { font-size: 11px; color: var(--text-secondary); }

    /* Main */
    .main {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h2 {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .chat-header .actions {
      display: flex;
      gap: 8px;
    }

    .chat-header button {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
    }

    .chat-header button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.user .message-avatar { background: var(--accent); color: #fff; }
    .message.assistant .message-avatar { background: var(--bg-tertiary); color: var(--success); }
    .message.system .message-avatar { background: var(--warning); color: #000; }
    .message.tool .message-avatar { background: var(--bg-tertiary); color: var(--text-secondary); }

    .message-content {
      flex: 1;
      min-width: 0;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .message-header .name {
      font-size: 13px;
      font-weight: 500;
    }

    .message-header .time {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .message-body {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-body code {
      background: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .message-body pre {
      background: var(--bg-tertiary);
      padding: 12px;
      border-radius: var(--radius);
      overflow-x: auto;
      margin: 8px 0;
    }

    .message-body pre code {
      background: none;
      padding: 0;
    }

    .message-text {
      word-break: break-word;
    }

    /* Rendered markdown — compact, chat-like density.
       white-space:normal is REQUIRED: .message-body sets pre-wrap, and
       marked emits "\n" between block elements — inherited pre-wrap renders
       each as a real blank line, doubling the gaps. */
    .message-text { line-height: 1.5; white-space: normal; }
    .message-text > :first-child { margin-top: 0; }
    .message-text > :last-child { margin-bottom: 0; }
    .message-text p { margin: 3px 0; }
    .message-text h1, .message-text h2, .message-text h3,
    .message-text h4, .message-text h5, .message-text h6 {
      margin: 8px 0 3px;
      line-height: 1.3;
      color: var(--text);
    }
    .message-text h1 { font-size: 16px; }
    .message-text h2 { font-size: 15px; }
    .message-text h3 { font-size: 14px; }
    .message-text h4, .message-text h5, .message-text h6 { font-size: 14px; }
    .message-text ul, .message-text ol {
      margin: 3px 0;
      padding-left: 20px;
    }
    .message-text li { margin: 1px 0; }
    .message-text li > p { margin: 0; }
    .message-text li > ul, .message-text li > ol { margin: 1px 0; }
    .message-text blockquote {
      margin: 4px 0;
      padding: 4px 10px;
      border-left: 3px solid var(--border);
      color: var(--text-secondary);
    }
    .message-text a { color: var(--accent); text-decoration: none; }
    .message-text a:hover { text-decoration: underline; }
    .message-text hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0;
    }
    .message-text table {
      border-collapse: collapse;
      margin: 3px 0;
      font-size: 13px;
    }
    .message-text th, .message-text td {
      border: 1px solid var(--border);
      padding: 3px 8px;
    }
    .message-text th { background: var(--bg-tertiary); }
    .message-text pre {
      background: var(--bg-tertiary);
      padding: 8px 10px;
      border-radius: var(--radius);
      overflow-x: auto;
      margin: 4px 0;
    }
    .message-text pre code {
      background: none;
      padding: 0;
      font-size: 13px;
    }
    .message-text code {
      background: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 0.9em;
    }

    /* Think chain (collapsible) */
    .think-block {
      margin: 4px 0 10px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--warning);
      border-radius: var(--radius);
      background: var(--bg-secondary);
      overflow: hidden;
    }

    .think-block > summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
      user-select: none;
      list-style: none;
      transition: color 0.15s;
    }

    .think-block > summary::-webkit-details-marker { display: none; }

    .think-block > summary::before {
      content: '▸';
      font-size: 10px;
      transition: transform 0.15s;
    }

    .think-block[open] > summary::before { transform: rotate(90deg); }
    .think-block > summary:hover { color: var(--text); }

    .think-duration {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--warning);
    }

    .think-body {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 320px;
      overflow-y: auto;
    }

    .tool-call {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 8px;
    }

    .tool-call-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .tool-call-header .tool-name {
      color: var(--accent);
      font-weight: 500;
    }

    .tool-call-args {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--bg);
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
    }

    /* Input */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .input-box {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      position: relative;
    }

    .input-box textarea {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 200px;
      overflow-y: auto;
      font-family: var(--font-sans);
    }

    .input-box textarea:focus {
      border-color: var(--accent);
    }

    .input-box textarea:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .conn-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .conn-label.offline { color: var(--danger); }

    .msg-time {
      margin-left: 8px;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      text-align: center;
      padding: 40px;
    }

    .empty-icon { font-size: 32px; opacity: 0.6; }

    .empty-sub { font-size: 12px; opacity: 0.7; }

    .chat-header .actions button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Task panel */
    .main { position: relative; }

    .task-panel {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 300px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      z-index: 15;
      display: flex;
      flex-direction: column;
    }

    .task-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .task-panel-actions { display: flex; gap: 6px; }

    .task-create {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .task-create input, .task-create textarea, .task-create select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 12px;
      padding: 7px 10px;
      font-family: var(--font-sans);
      outline: none;
      resize: none;
    }

    .task-create input:focus, .task-create textarea:focus { border-color: var(--accent); }

    .task-create button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 7px;
      font-size: 12px;
      cursor: pointer;
    }

    .task-list { flex: 1; overflow-y: auto; padding: 10px; }

    .task-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .task-card .task-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; }

    .task-card .task-meta { color: var(--text-secondary); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .task-state {
      padding: 1px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .task-state.ready { background: var(--bg-tertiary); color: var(--text-secondary); }
    .task-state.in_progress { background: rgba(88,166,255,0.15); color: var(--accent); }
    .task-state.review { background: rgba(210,153,34,0.15); color: var(--warning); }
    .task-state.done { background: rgba(63,185,80,0.15); color: var(--success); }
    .task-state.cancelled { background: rgba(248,81,73,0.15); color: var(--danger); }

    .task-actions { margin-top: 8px; display: flex; gap: 6px; }

    .task-actions button {
      flex: 1;
      padding: 5px;
      font-size: 11px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: none;
      color: var(--text);
      cursor: pointer;
    }

    .task-actions .approve-btn { color: var(--success); border-color: var(--success); }
    .task-actions .return-btn { color: var(--warning); border-color: var(--warning); }

    .task-card details { margin-top: 6px; color: var(--text-secondary); }
    .task-card details summary { cursor: pointer; font-size: 11px; }
    .task-card details .evidence-body { white-space: pre-wrap; word-break: break-word; margin-top: 4px; max-height: 200px; overflow-y: auto; }

    .input-box button {
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-box button:hover { background: var(--accent-hover); }
    .input-box button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* REGRESSION GUARD: 5158f84 曾误删本规则——20+ 处 classList.toggle('hidden')
       全部失效，审批弹窗/任务面板恒显且按钮静默无效。删除前全局搜 classList。 */
    .hidden { display: none !important; }

    /* Approval Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
    }

    .modal h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .modal p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .modal .tool-info {
      background: var(--bg-tertiary);
      padding: 12px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 12px;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }

    .modal-actions .btn-approve { background: var(--success); color: #fff; }
    .modal-actions .btn-reject { background: var(--danger); color: #fff; }
    /* Settings panel — 与 task-panel 互斥打开的右抽屉，复用 task-panel-header/room-add-btn 风格 */
    .settings-panel {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 320px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      z-index: 15;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .settings-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .settings-panel-actions { display: flex; gap: 6px; }
    .settings-section {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .settings-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .settings-hint {
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0.7;
    }
    .settings-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .settings-row label {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .settings-row input,
    .settings-row textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 12px;
      padding: 6px 10px;
      font-family: inherit;
      resize: vertical;
    }
    .settings-row textarea { min-height: 60px; }
    .settings-actions-row { flex-direction: row; align-items: center; gap: 10px; }
    .settings-actions-row button {
      padding: 5px 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
    }
    .settings-actions-row button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .settings-actions-row button.saved {
      border-color: var(--success);
      color: var(--success);
    }
    .settings-status {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .settings-status.ok { color: var(--success); }
    .settings-status.err { color: var(--danger); }
    .settings-agent-card {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-agent-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .settings-agent-head .agent-id { font-weight: 600; }
    .settings-agent-head .agent-host {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .settings-agent-card.is-offline { opacity: 0.55; }
    .settings-agent-card.is-error { border-color: var(--danger); }
    .settings-agent-card .error-msg {
      font-size: 11px;
      color: var(--danger);
    }


    /* Chat rooms */
    .room-section {
      border-top: 1px solid var(--border);
      padding: 8px 0;
      max-height: 40%;
      overflow-y: auto;
    }

    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .room-add-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius);
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }

    .room-add-btn:hover { color: var(--accent); border-color: var(--accent); }

    .room-list { padding: 0 8px; }

    .member-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .member-chips:empty { display: none; }

    .member-chip {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .member-chip.agent { color: var(--accent); border-color: var(--accent); }
    .member-chip.offline { opacity: 0.5; }

    /* Online status dot — 8px green pulse for live agents, 6px grey for offline.
       Scoped under .member-chip so the settings-panel agent cards can opt in
       by reusing the same .presence-dot class without colliding. */
    .member-chip .presence-dot,
    .presence-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 5px;
      vertical-align: middle;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .presence-dot.offline {
      width: 6px;
      height: 6px;
      background: var(--text-secondary);
      box-shadow: none;
      opacity: 0.6;
    }

    .message.system .message-body { color: var(--warning); font-style: italic; }
    /* 图片附件（registry /bus-files 代理） */
    .chat-image {
      display: block;
      max-width: min(360px, 100%);
      max-height: 320px;
      border-radius: var(--radius);
      margin-top: 6px;
      cursor: zoom-in;
    }

    /* @mention */
    .mention {
      color: var(--accent);
      background: var(--bg-tertiary);
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 500;
    }

    .mention-popup {
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 6px;
      min-width: 180px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .mention-item {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mention-item:hover, .mention-item.active { background: var(--bg-tertiary); }

    .mention-item::before { content: '🤖'; font-size: 12px; }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>
          <span class="status" id="connectionStatus"></span>
          Agent Harness
        </h1>
        <div class="conn-label" id="connLabel">连接中…</div>
      </div>
      <button class="new-thread-btn" onclick="createThread()">+ New Thread</button>
      <div class="thread-list" id="threadList"></div>
      <div class="room-section" id="roomSection">
        <div class="room-header">
          <span>聊天室</span>
          <button class="room-add-btn" onclick="createRoomPrompt()" title="新建聊天室">+</button>
        </div>
        <div class="room-list" id="roomList"></div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="chat-header">
        <button class="sidebar-toggle" id="sidebarToggle" title="折叠/展开侧边栏">☰</button>
        <div class="chat-header-main">
          <h2 id="threadTitle">Select a thread</h2>
          <div class="member-chips" id="memberChips"></div>
        </div>
        <div class="actions">
          <button id="tasksBtn" onclick="toggleTaskPanel()">任务</button>
          <button id="forkBtn" onclick="forkThread()">Fork</button>

          <button id="settingsBtn" onclick="toggleSettingsPanel()" title="设置">⚙</button>

          <button id="archiveBtn" onclick="archiveThread()">Archive</button>
        </div>
      </div>

      <div class="task-panel hidden" id="taskPanel">
        <div class="task-panel-header">
          <span>任务板</span>
          <span class="task-panel-actions">
            <button class="room-add-btn" onclick="refreshTasks()" title="刷新">↻</button>
            <button class="room-add-btn" onclick="toggleTaskPanel()" title="关闭">✕</button>
          </span>
        </div>
        <div class="task-create">
          <input id="taskTitle" placeholder="任务标题" />
          <textarea id="taskAcceptance" placeholder="验收标准（每行一条，必填）" rows="3"></textarea>
          <select id="taskOwner"></select>
          <button onclick="createTask()">创建并指派</button>
        </div>
        <div class="task-list" id="taskList"></div>
      </div>

      <div class="settings-panel hidden" id="settingsPanel">
        <div class="settings-panel-header">
          <span>设置</span>
          <span class="settings-panel-actions">
            <button class="room-add-btn" onclick="toggleSettingsPanel()" title="关闭">✕</button>
          </span>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">网关基础配置</div>
          <div class="settings-row">
            <label for="settingsUserName">用户名</label>
            <input id="settingsUserName" placeholder="聊天消息发送者名称" />
          </div>
          <div class="settings-row">
            <label for="settingsContextTokens">上下文预算 (tokens)</label>
            <input id="settingsContextTokens" type="number" min="500" max="20000" step="100" />
          </div>
          <div class="settings-row settings-actions-row">
            <button id="settingsGatewaySave" onclick="saveGatewayConfig()">保存</button>
            <span id="settingsGatewayStatus" class="settings-status"></span>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">Agent 成员</div>
          <div class="settings-hint" id="settingsAgentHint">请先进入一个聊天室</div>
          <div id="settingsAgentList"></div>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div>选择左侧的会话，或点「+ New Thread」开始新对话</div>
          <div class="empty-sub">聊天室 # 频道可与其他 agent 群聊，@ 可点名</div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <div class="mention-popup hidden" id="mentionPopup"></div>
          <textarea
            id="messageInput"
            placeholder="Type a message... (@ 指定 agent, Shift+Enter 换行)"
            rows="1"
            onkeydown="handleKeydown(event)"
            oninput="handleInput()"
          ></textarea>
          <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Approval Modal -->
  <div class="modal-overlay hidden" id="approvalModal">
    <div class="modal">
      <h3>Approval Required</h3>
      <p>The agent wants to execute a tool:</p>
      <div class="tool-info" id="approvalToolInfo"></div>
      <div class="modal-actions">
        <button class="btn-reject" onclick="resolveApproval(false)">Reject</button>
        <button class="btn-approve" onclick="resolveApproval(true)">Approve</button>
      </div>
    </div>
  </div>

  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script>
    // ── Config ──
    const WS_URL = `ws://${location.host}/jsonrpc`;
    marked.setOptions({ gfm: true, breaks: true });
    let ws = null;
    let currentThreadId = null;
    let currentRoom = null;
    let roomList = [];
    let pendingApprovalId = null;
    let messageId = 0;
    let lastActivityAt = null;
    const threads = new Map();

    /** presenceByRoom: room → Set<agentId> currently online (live within 60s window). */
    const presenceByRoom = new Map();
    /** memberListByRoom: room → string[] (from room/list, drives the chip layout). */
    const memberListByRoom = new Map();

    /** Render the chip strip from cached members + online state. Idempotent. */
    function renderMemberChips(room) {
      const chips = document.getElementById('memberChips');
      const members = memberListByRoom.get(room) ?? [];
      const online = presenceByRoom.get(room) ?? new Set();
      chips.innerHTML = '';
      for (const m of members) {
        const isOnline = online.has(m);
        const chip = document.createElement('span');
        chip.className = `member-chip ${m.includes('gateway') ? '' : 'agent'} ${isOnline ? '' : 'offline'}`.trim();
        const dot = document.createElement('span');
        dot.className = `presence-dot ${isOnline ? '' : 'offline'}`.trim();
        chip.appendChild(dot);
        chip.appendChild(document.createTextNode(m));
        chip.title = isOnline
          ? (agentSummaries[m] ?? (m.includes('gateway') ? '网关' : '能力未上报（旧代码）'))
          : `${m} (离线)`;
        chips.appendChild(chip);
      }
    }
    // ── UI helpers ──
    function fmtTime(ts) {
      const d = new Date(ts);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      return sameDay ? hm : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
    }

    function handleInput() {
      const el = document.getElementById('messageInput');
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
      updateMentionPopup();
    }

    function updateComposerState() {
      const active = !!(currentThreadId || currentRoom);
      const input = document.getElementById('messageInput');
      input.disabled = !active;
      document.getElementById('sendBtn').disabled = !active;
      document.getElementById('forkBtn').disabled = !currentThreadId;
      document.getElementById('archiveBtn').disabled = !currentThreadId;
      document.getElementById('tasksBtn').disabled = !currentRoom;
      if (!currentRoom) document.getElementById('taskPanel').classList.add('hidden');
      input.placeholder = currentRoom
        ? `发送到 #${currentRoom}（@ 指定 agent，Shift+Enter 换行）`
        : currentThreadId
          ? 'Type a message... (Shift+Enter for new line)'
          : '先选择左侧的会话或聊天室…';
    }

    function showEmptyState(mode) {
      const msgs = document.getElementById('messages');
      msgs.innerHTML = mode === 'room'
        ? `<div class="empty-state"><div class="empty-icon">#</div><div>聊天室还没有消息</div><div class="empty-sub">直接发言全员可见，@agent名 可点名对话</div></div>`
        : `<div class="empty-state"><div class="empty-icon">💬</div><div>选择左侧的会话，或点「+ New Thread」开始新对话</div><div class="empty-sub">聊天室 # 频道可与其他 agent 群聊，@ 可点名</div></div>`;
    }

    function threadTitleOf(thread) {
      for (const turn of thread.turns ?? []) {
        const userItem = (turn.items ?? []).find(i => i.role === 'user' && i.content);
        if (userItem) return userItem.content.length > 24 ? userItem.content.slice(0, 24) + '…' : userItem.content;
      }
      return '新会话';
    }

    // ── WebSocket ──
    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        document.getElementById('connectionStatus').classList.remove('disconnected');
        const label = document.getElementById('connLabel');
        label.textContent = '已连接';
        label.classList.remove('offline');
        loadThreads();
        loadRooms();
      };

      ws.onclose = () => {
        document.getElementById('connectionStatus').classList.add('disconnected');
        const label = document.getElementById('connLabel');
        label.textContent = '连接断开，重连中…';
        label.classList.add('offline');
        setTimeout(connect, 3000);
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        handleMessage(msg);
      };
    }

    // ── JSON-RPC helpers ──
    function rpc(method, params = {}) {
      const id = ++messageId;
      return new Promise((resolve, reject) => {
        // 30s 超时：服务端不回（agent 扇出慢/断链）时必须有终态，
        // 否则设置页等 UI 永远停在「加载中…」。
        const timer = setTimeout(() => {
          ws.removeEventListener('message', handler);
          reject(new Error(`rpc ${method} timeout after 30s`));
        }, 30_000);
        const handler = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.id === id) {
            clearTimeout(timer);
            ws.removeEventListener('message', handler);
            resolve(msg);
          }
        };
        ws.addEventListener('message', handler);
        if (ws.readyState !== WebSocket.OPEN) {
          clearTimeout(timer);
          ws.removeEventListener('message', handler);
          reject(new Error('连接已断开，正在重连'));
          return;
        }
        ws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
      });
    }

    function notify(method, params = {}) {
      ws.send(JSON.stringify({ jsonrpc: '2.0', method, params }));
    }

    // ── Message handling ──
    function handleMessage(msg) {
      // Notifications
      if (msg.method) {
        switch (msg.method) {
          case 'room/presence': {
            const p = msg.params;
            if (p && Array.isArray(p.members) && Array.isArray(p.online)) {
              memberListByRoom.set(p.room, p.members);
              presenceByRoom.set(p.room, new Set(p.online));
              if (p.room === currentRoom) renderMemberChips(p.room);
            }
            break;
          }
          case 'turn/started':
            lastActivityAt = Date.now();
            showTyping();
            break;
          case 'turn/completed':
            hideTyping();
            break;
          case 'item/delta':
            appendDelta(msg.params);
            break;
          case 'item/completed':
            renderItem(msg.params.item);
            break;
          case 'room/message':
            if (msg.params.room === currentRoom) {
              renderRoomMessage(msg.params);
              refreshTasks();
            }
            break;
          case 'tool_call/started':
            renderToolCall(msg.params.toolCall);
            break;
          case 'tool_call/completed':
            updateToolResult(msg.params);
            break;
          case 'approval/required':
            showApproval(msg.params);
            break;
          case 'system/connected':
            console.log('Connected:', msg.params.clientId);
            break;
        }
        return;
      }
    }

    // ── Thread management ──
    async function loadThreads() {
      const res = await rpc('thread/list');
      const list = res.result?.threads || [];
      list.forEach(t => threads.set(t.id, t));
      renderThreadList();
    }

    async function createThread() {
      const res = await rpc('thread/create');
      const thread = res.result?.thread;
      if (thread) {
        threads.set(thread.id, thread);
        selectThread(thread.id);
        renderThreadList();
      }
    }

    async function forkThread() {
      if (!currentThreadId) return;
      const res = await rpc('thread/fork', { sourceId: currentThreadId });
      const thread = res.result?.thread;
      if (thread) {
        threads.set(thread.id, thread);
        selectThread(thread.id);
        renderThreadList();
      }
    }

    async function archiveThread() {
      if (!currentThreadId) return;
      await rpc('thread/archive', { id: currentThreadId });
      threads.delete(currentThreadId);
      currentThreadId = null;
      updateComposerState();
      showEmptyState('thread');
      document.getElementById('threadTitle').textContent = 'Select a thread';
      renderThreadList();
    }

    async function selectThread(id) {
      currentThreadId = id;
      currentRoom = null;
      document.getElementById('memberChips').innerHTML = '';
      updateComposerState();
      const res = await rpc('thread/get', { id });
      const thread = res.result?.thread;
      if (thread) {
        renderThread(thread);
        renderThreadList();
      }
    }

    function renderThreadList() {
      const list = document.getElementById('threadList');
      list.innerHTML = '';
      for (const [id, thread] of threads) {
        const div = document.createElement('div');
        div.className = `thread-item ${id === currentThreadId ? 'active' : ''}`;
        div.onclick = () => selectThread(id);
        div.innerHTML = `
          <span class="icon">💬</span>
          <span class="title">${threadTitleOf(thread)}</span>
          <span class="time">${fmtTime(thread.updatedAt)}</span>
        `;
        list.appendChild(div);
      }
    }

    // ── Chat rooms (multi-agent via bus registry) ──
    async function loadRooms() {
      try {
        const res = await rpc('room/list');
        if (res.error) throw new Error(res.error.message);
        roomList = res.result?.rooms || [];
        renderRoomList();
      } catch {
        // Server has no bus gateway — hide the section
        document.getElementById('roomSection').style.display = 'none';
      }
    }

    function renderRoomList() {
      const list = document.getElementById('roomList');
      list.innerHTML = '';
      for (const room of roomList) {
        const div = document.createElement('div');
        div.className = `thread-item ${room.name === currentRoom ? 'active' : ''}`;
        div.onclick = () => selectRoom(room.name);
        const agentCount = room.members.filter(m => !m.includes('gateway')).length;
        div.innerHTML = `
          <span class="icon">#</span>
          <span class="title">${room.name}</span>
          <span class="time">${agentCount} agent${agentCount === 1 ? '' : 's'}</span>
        `;
        list.appendChild(div);
      }
    }

    // 成员能力档案缓存（agent/cards RPC；选择房间时刷新）
    let agentSummaries = {};
    async function refreshAgentCards() {
      try {
        const res = await rpc('agent/cards', {});
        agentSummaries = {};
        for (const s of res.result?.summaries ?? []) {
          const sep = s.indexOf(': ');
          if (sep > 0) agentSummaries[s.slice(0, sep)] = s.slice(sep + 2);
        }
      } catch { /* registry 不可达时保留旧快照 */ }
    }

    async function selectRoom(name) {
      currentRoom = name;
      currentThreadId = null;
      document.getElementById('threadTitle').textContent = `# ${name}`;
      updateComposerState();
      renderThreadList();
      renderRoomList();
      await refreshAgentCards();

      const room = roomList.find(r => r.name === name);
      // Refresh member list cache + fetch an immediate presence snapshot.
      // The 15s polling loop will keep this fresh; this just avoids the
      // "all offline" flash before the first tick lands.
      if (room?.members) memberListByRoom.set(name, room.members);
      renderMemberChips(name);
      try {
        const p = await rpc('room/presence/get', { room: name });
        if (p.result) {
          memberListByRoom.set(name, p.result.members ?? room?.members ?? []);
          presenceByRoom.set(name, new Set(p.result.online ?? []));
          renderMemberChips(name);
        }
      } catch { /* registry blip → keep cached state, presence WS will recover */ }

      const msgs = document.getElementById('messages');
      msgs.innerHTML = '';
      const res = await rpc('room/history', { room: name });
      const history = res.result?.messages ?? [];
      if (history.length === 0) showEmptyState('room');
      for (const m of history) {
        renderRoomMessage(m);
      }
      refreshTasks();
      // 设置面板打开时切房需重拉成员配置
      if (!document.getElementById('settingsPanel').classList.contains('hidden')) {
        loadAgentConfigs();
      }
    }

    async function createRoomPrompt() {
      const name = prompt('聊天室名称（字母/数字/短横线）:');
      if (!name || !name.trim()) return;
      const res = await rpc('room/create', { name: name.trim() });
      if (res.error) {
        alert(`创建失败: ${res.error.message}`);
        return;
      }
      await loadRooms();
      await selectRoom(name.trim());
    }

    // ── @mention autocomplete ──
    let mentionMatches = [];

    function currentMentionToken() {
      const el = document.getElementById('messageInput');
      const uptoCursor = el.value.slice(0, el.selectionStart);
      const m = uptoCursor.match(/(?:^|\s)@([\w-]*)$/);
      return m ? { token: m[1], start: uptoCursor.length - m[1].length } : null;
    }

    function roomAgents() {
      const room = roomList.find(r => r.name === currentRoom);
      return (room?.members ?? []).filter(m => !m.includes('gateway'));
    }

    function updateMentionPopup() {
      const popup = document.getElementById('mentionPopup');
      const close = () => { popup.classList.add('hidden'); mentionMatches = []; };
      if (!currentRoom) { close(); return; }
      const tok = currentMentionToken();
      if (!tok) { close(); return; }
      mentionMatches = roomAgents().filter(a => a !== tok.token && a.toLowerCase().includes(tok.token.toLowerCase()));
      if (mentionMatches.length === 0) { close(); return; }
      popup.innerHTML = '';
      for (const a of mentionMatches) {
        const item = document.createElement('div');
        item.className = 'mention-item';
        item.textContent = a;
        item.onmousedown = (e) => { e.preventDefault(); completeMention(a); };
        popup.appendChild(item);
      }
      popup.classList.remove('hidden');
    }

    function completeMention(name) {
      const el = document.getElementById('messageInput');
      const tok = currentMentionToken();
      if (!tok) return;
      el.value = el.value.slice(0, tok.start) + name + ' ' + el.value.slice(el.selectionStart);
      el.selectionStart = el.selectionEnd = tok.start + name.length + 1;
      el.focus();
      updateMentionPopup();
    }

    function appendTextWithMentions(body, text) {
      const re = /@([\w-]+)/g;
      let last = 0;
      for (const m of text.matchAll(re)) {
        body.appendChild(document.createTextNode(text.slice(last, m.index)));
        const span = document.createElement('span');
        span.className = 'mention';
        span.textContent = m[0];
        body.appendChild(span);
        last = m.index + m[0].length;
      }
      body.appendChild(document.createTextNode(text.slice(last)));
    }

    // ── Task board ──
    function toggleTaskPanel() {
      document.getElementById('taskPanel').classList.toggle('hidden');
      refreshTasks();
    }

    async function refreshTasks() {
      if (!currentRoom || document.getElementById('taskPanel').classList.contains('hidden')) return;
      const ownerSel = document.getElementById('taskOwner');
      ownerSel.innerHTML = '<option value="">（暂不指派）</option>' +
        roomAgents().map(a => {
          const s = agentSummaries[a];
          return `<option value="${a}" title="${s ?? '能力未上报'}">${a}${s ? `（${s.length > 46 ? s.slice(0, 46) + '…' : s}）` : ''}</option>`;
        }).join('');
      const res = await rpc('task/list', { room: currentRoom });
      const tasks = res.result?.tasks ?? [];
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      for (const t of tasks) {
        list.appendChild(renderTaskCard(t));
      }
      if (tasks.length === 0) {
        list.innerHTML = '<div style="color:var(--text-secondary);font-size:12px;text-align:center;padding:20px">暂无任务</div>';
      }
    }

    function renderTaskCard(t) {
      const card = document.createElement('div');
      card.className = 'task-card';
      const stateNames = { ready: '待认领', in_progress: '进行中', review: '待验收', done: '已完成', cancelled: '已取消' };
      let html = `<div class="task-title">${escapeHtml(t.title)}</div>
        <div class="task-meta">
          <span class="task-state ${t.state}">${stateNames[t.state] ?? t.state}</span>
          ${t.owner ? `<span>👤 ${escapeHtml(t.owner)}</span>` : ''}
          <span>验收 ${t.acceptance.length} 条</span>
        </div>`;
      if (t.evidence.length > 0) {
        html += `<details><summary>evidence ×${t.evidence.length}</summary><div class="evidence-body">${escapeHtml(t.evidence[t.evidence.length - 1])}</div></details>`;
      }
      card.innerHTML = html;
      if (t.state === 'review') {
        const actions = document.createElement('div');
        actions.className = 'task-actions';
        actions.innerHTML = `<button class="approve-btn">通过</button><button class="return-btn">退回</button>`;
        actions.children[0].onclick = () => taskAction('task/approve', { taskId: t.id });
        actions.children[1].onclick = () => {
          const note = prompt('退回原因（会发给执行 agent 返工）:');
          if (note) taskAction('task/return', { taskId: t.id, note });
        };
        card.appendChild(actions);
      }
      return card;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function taskAction(method, params) {
      const res = await rpc(method, params);
      if (res.error) alert(res.error.message);
      refreshTasks();
    }

    async function createTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const acceptance = document.getElementById('taskAcceptance').value.split('\n').map(s => s.trim()).filter(Boolean);
      const owner = document.getElementById('taskOwner').value || undefined;
      if (!title) { alert('请填任务标题'); return; }
      const res = await rpc('task/create', { room: currentRoom, title, acceptance, owner });
      if (res.error) { alert(res.error.message); return; }
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskAcceptance').value = '';
      refreshTasks();
    }

    function renderRoomMessage(m) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${m.kind === 'user' ? 'user' : m.kind === 'system' ? 'system' : 'assistant'}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = m.from.slice(0, 1).toUpperCase();

      const content = document.createElement('div');
      content.className = 'message-content';
      const time = fmtTime(m.ts);
      content.innerHTML = `<div class="message-header"><span class="name">${m.from}</span><span class="msg-time">${time}</span></div>`;

      const body = document.createElement('div');
      body.className = 'message-body';
      if (m.kind === 'agent') {
        renderMessageContent(body, { role: 'assistant', content: m.text, createdAt: m.ts });
      } else {
        appendTextWithMentions(body, m.text);
      }
      if (m.image) {
        const img = document.createElement('img');
        img.className = 'chat-image';
        img.src = m.image;
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer'; // 防 URL 将来改绝对地址时路径经 Referer 泄漏
        img.onclick = () => window.open(m.image, '_blank');
        body.appendChild(img);
      }

      content.appendChild(body);
      div.appendChild(avatar);
      div.appendChild(content);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      // Advance the think-duration baseline (mirrors renderItem): without this
      // room messages measured against a stale thread-render timestamp.
      lastActivityAt = m.ts ?? Date.now();
    }
    function renderThread(thread) {
      document.getElementById('threadTitle').textContent = threadTitleOf(thread);
      const msgs = document.getElementById('messages');
      msgs.innerHTML = '';
      let rendered = 0;
      for (const turn of thread.turns) {
        lastActivityAt = turn.startedAt ?? null;
        for (const item of turn.items) {
          renderItem(item);
          rendered++;
        }
      }
      if (rendered === 0) showEmptyState('thread');
    }

    // ── Message rendering ──
    function renderItem(item) {
      const msgs = document.getElementById('messages');
      const existing = document.getElementById(`item-${item.id}`);
      if (existing) existing.remove();

      const div = document.createElement('div');
      div.id = `item-${item.id}`;
      div.className = `message ${item.role || 'system'}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = getAvatar(item);

      const content = document.createElement('div');
      content.className = 'message-content';

      const header = document.createElement('div');
      header.className = 'message-header';
      header.innerHTML = `<span class="name">${item.role || 'system'}</span>` +
        (item.createdAt ? `<span class="msg-time">${fmtTime(item.createdAt)}</span>` : '');

      const body = document.createElement('div');
      body.className = 'message-body';
      renderMessageContent(body, item);

      content.appendChild(header);
      content.appendChild(body);
      div.appendChild(avatar);
      div.appendChild(content);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      lastActivityAt = item.createdAt ?? Date.now();
    }

    function renderMessageContent(body, item) {
      const text = item.content || '';
      if (item.role !== 'assistant') {
        body.textContent = text;
        return;
      }
      const appendMarkdown = (md) => {
        const div = document.createElement('div');
        div.className = 'message-text';
        div.innerHTML = DOMPurify.sanitize(marked.parse(md));
        body.appendChild(div);
      };
      if (!text.includes('<think>')) {
        appendMarkdown(text);
        return;
      }
      const parts = text.split(/<think>([\s\S]*?)<\/think>/);
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 1) {
          if (parts[i].trim()) body.appendChild(buildThinkBlock(parts[i], item));
        } else {
          const seg = parts[i].replace(/<\/?think>/g, '').trim();
          if (seg) appendMarkdown(seg);
        }
      }
    }

    function buildThinkBlock(thinkText, item) {
      const details = document.createElement('details');
      details.className = 'think-block';

      const summary = document.createElement('summary');
      const label = document.createElement('span');
      label.textContent = '🧠 思考过程';
      summary.appendChild(label);

      const duration = computeThinkDuration(item);
      if (duration) {
        const dur = document.createElement('span');
        dur.className = 'think-duration';
        dur.textContent = `耗时 ${duration}`;
        summary.appendChild(dur);
      }

      const thinkBody = document.createElement('div');
      thinkBody.className = 'think-body';
      thinkBody.textContent = thinkText.trim();

      details.appendChild(summary);
      details.appendChild(thinkBody);
      return details;
    }

    function computeThinkDuration(item) {
      if (!lastActivityAt || !item.createdAt || item.createdAt <= lastActivityAt) return null;
      const ms = item.createdAt - lastActivityAt;
      return ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(1)}s`;
    }

    function renderToolCall(toolCall) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message tool';
      div.innerHTML = `
        <div class="message-avatar">🔧</div>
        <div class="message-content">
          <div class="tool-call">
            <div class="tool-call-header">
              <span>Tool:</span>
              <span class="tool-name">${toolCall.name}</span>
            </div>
            <div class="tool-call-args">${JSON.stringify(toolCall.arguments, null, 2)}</div>
          </div>
        </div>
      `;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function updateToolResult(params) {
      // Could update the tool call with result
    }

    function appendDelta(params) {
      // Stream incremental updates
    }

    function showTyping() {
      const msgs = document.getElementById('messages');
      if (document.getElementById('typing-indicator')) return;
      const div = document.createElement('div');
      div.id = 'typing-indicator';
      div.className = 'message assistant';
      div.innerHTML = `
        <div class="message-avatar">🤖</div>
        <div class="message-content">
          <div class="typing">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function getAvatar(item) {
      switch (item.role) {
        case 'user': return 'U';
        case 'assistant': return 'A';
        case 'developer': return 'D';
        default: return 'S';
      }
    }

    // ── Input ──
    function handleKeydown(e) {
      // IME composition (e.g. Chinese input): Enter confirms the candidate,
      // must not complete mention or send the message.
      if (e.isComposing || e.keyCode === 229) return;
      // Mention popup steals Enter/Tab/Escape while open
      if (mentionMatches.length > 0) {
        if (e.key === 'Enter' || e.key === 'Tab') {
          e.preventDefault();
          completeMention(mentionMatches[0]);
          return;
        }
        if (e.key === 'Escape') {
          mentionMatches = [];
          document.getElementById('mentionPopup').classList.add('hidden');
          return;
        }
      }
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      // Chat-room mode: gateway echoes our message back via room/message
      if (currentRoom) {
        input.value = '';
        input.style.height = 'auto';
        mentionMatches = [];
        document.getElementById('mentionPopup').classList.add('hidden');
        const res = await rpc('room/send', { room: currentRoom, text });
        if (res.error) alert(`发送失败: ${res.error.message}`);
        return;
      }

      if (!currentThreadId) return;

      input.value = '';
      input.style.height = 'auto';

      // Render user message immediately
      renderItem({
        id: `user-${Date.now()}`,
        type: 'message',
        role: 'user',
        content: text,
        status: 'completed',
        createdAt: Date.now(),
      });

      document.getElementById('sendBtn').disabled = true;

      try {
        await rpc('turn/submit', { threadId: currentThreadId, input: text });
      } catch (err) {
        console.error('Failed to submit:', err);
      } finally {
        document.getElementById('sendBtn').disabled = false;
      }
    }
    // ── Settings panel ──
    // 与 task-panel 互斥打开；保存成功后按钮短暂变 ✓，失败/未保存显示文案。
    function toggleSettingsPanel() {
      const sp = document.getElementById('settingsPanel');
      const tp = document.getElementById('taskPanel');
      const willShow = sp.classList.contains('hidden');
      if (willShow) {
        tp.classList.add('hidden');
        sp.classList.remove('hidden');
        refreshSettingsPanel();
      } else {
        sp.classList.add('hidden');
      }
    }

    async function refreshSettingsPanel() {
      await Promise.all([loadGatewayConfig(), loadAgentConfigs()]);
    }

    async function loadGatewayConfig() {
      try {
        const res = await rpc('gateway/config/get');
        const cfg = res.result ?? {};
        document.getElementById('settingsUserName').value = cfg.userName ?? '';
        document.getElementById('settingsContextTokens').value = cfg.contextTokens ?? 3000;
      } catch (err) {
        document.getElementById('settingsGatewayStatus').textContent = `读取失败: ${err.message ?? err}`;
        document.getElementById('settingsGatewayStatus').className = 'settings-status err';
      }
    }

    async function loadAgentConfigs() {
      const hint = document.getElementById('settingsAgentHint');
      const list = document.getElementById('settingsAgentList');
      if (!currentRoom) {
        hint.textContent = '请先进入一个聊天室';
        list.innerHTML = '';
        return;
      }
      hint.textContent = `房间 #${currentRoom} 的成员配置`;
      list.innerHTML = '<div class="settings-hint">加载中…</div>';
      let res;
      try {
        res = await rpc('agent/config/getAll', { room: currentRoom });
      } catch (err) {
        list.innerHTML = `<div class="settings-hint">加载失败: ${escapeHtml(err.message ?? String(err))}</div>`;
        return;
      }
      const agents = res.result?.agents ?? [];
      list.innerHTML = '';
      if (agents.length === 0) {
        list.innerHTML = '<div class="settings-hint">房间内暂无其他 agent</div>';
        return;
      }
      for (const a of agents) list.appendChild(renderAgentConfigCard(a));
    }

    function renderAgentConfigCard(a) {
      const card = document.createElement('div');
      card.className = 'settings-agent-card';
      const isOffline = !a.online;
      const hasError = !!a.error;
      if (isOffline) card.classList.add('is-offline');
      if (hasError) card.classList.add('is-error');
      const cfg = a.config ?? {};
      const persona = cfg.persona ?? '';
      const modelSmall = cfg.modelSmall ?? '';
      const host = cfg.host ?? '?';
      card.innerHTML = `
        <div class="settings-agent-head">
          <span class="presence-dot"></span>
          <span class="agent-id">${escapeHtml(a.agentId)}</span>
          <span class="agent-host">@ ${escapeHtml(host)}</span>
        </div>
        ${hasError ? `<div class="error-msg">配置读取失败: ${escapeHtml(a.error ?? '')}</div>` : ''}
        ${isOffline ? '<div class="settings-hint">离线，未拉取配置</div>' : ''}
        <div class="settings-row">
          <label>persona</label>
          <textarea data-role="persona" rows="2">${escapeHtml(persona)}</textarea>
        </div>
        <div class="settings-row">
          <label>modelSmall</label>
          <input data-role="modelSmall" value="${escapeHtml(modelSmall)}" />
        </div>
        <div class="settings-actions-row">
          <button data-role="save">保存</button>
          <span class="settings-status" data-role="status"></span>
        </div>
      `;
      // agent 上线点：offline = 半透明灰点（PresenceAgent 的 .is-offline 处理），
      // online = 绿点。host 上报失败时 host 显示 "?"；online=false 整张卡半透明。
      if (isOffline) card.classList.add('offline');
      const saveBtn = card.querySelector('[data-role="save"]');
      const status = card.querySelector('[data-role="status"]');
      // 离线 agent 的 set 必然 10s 超时失败——直接禁用，别让用户等一个注定的失败。
      if (isOffline) {
        saveBtn.disabled = true;
        saveBtn.title = 'agent 离线，无法保存';
      }
      saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        status.textContent = '';
        status.className = 'settings-status';
        const personaEl = card.querySelector('[data-role="persona"]');
        const modelSmallEl = card.querySelector('[data-role="modelSmall"]');
        let r;
        try {
          r = await rpc('agent/config/set', {
            room: currentRoom,
            target: a.agentId,
            patch: { persona: personaEl.value, modelSmall: modelSmallEl.value },
          });
        } catch (err) {
          saveBtn.disabled = false;
          status.textContent = `失败: ${err.message ?? err}`;
          status.className = 'settings-status err';
          return;
        }
        saveBtn.disabled = false;
        if (r.error) {
          status.textContent = `失败: ${r.error.message}`;
          status.className = 'settings-status err';
          return;
        }
        if (!r.result?.ok) {
          status.textContent = `失败: ${r.result?.error ?? 'unknown'}`;
          status.className = 'settings-status err';
          return;
        }
        saveBtn.classList.add('saved');
        saveBtn.textContent = '✓';
        status.textContent = '已保存';
        status.className = 'settings-status ok';
        setTimeout(() => {
          saveBtn.classList.remove('saved');
          saveBtn.textContent = '保存';
        }, 1500);
      };
      return card;
    }

    async function saveGatewayConfig() {
      const btn = document.getElementById('settingsGatewaySave');
      const status = document.getElementById('settingsGatewayStatus');
      const userName = document.getElementById('settingsUserName').value.trim();
      const contextTokens = Number(document.getElementById('settingsContextTokens').value);
      btn.disabled = true;
      status.textContent = '';
      status.className = 'settings-status';
      let r;
      try {
        r = await rpc('gateway/config/set', {
          userName: userName || undefined,
          contextTokens: Number.isFinite(contextTokens) ? contextTokens : undefined,
        });
      } catch (err) {
        btn.disabled = false;
        status.textContent = `失败: ${err.message ?? err}`;
        status.className = 'settings-status err';
        return;
      }
      btn.disabled = false;
      if (r.error) {
        status.textContent = `失败: ${r.error.message}`;
        status.className = 'settings-status err';
        return;
      }
      if (!r.result?.ok) {
        status.textContent = '保存失败';
        status.className = 'settings-status err';
        return;
      }
      // 回写服务端实际生效值：超界被裁剪/非法被丢弃时，输入框立即显示真相，
      // 杜绝「显示已保存但刷新后变样」的假象。
      if (r.result.applied) {
        document.getElementById('settingsUserName').value = r.result.applied.userName ?? '';
        document.getElementById('settingsContextTokens').value = r.result.applied.contextTokens ?? '';
      }
      btn.classList.add('saved');
      btn.textContent = '✓';
      status.textContent = '已保存';
      status.className = 'settings-status ok';
      setTimeout(() => {
        btn.classList.remove('saved');
        btn.textContent = '保存';
      }, 1500);
    }

    // ── Approval ──
    function showApproval(params) {
      pendingApprovalId = params.id;
      document.getElementById('approvalToolInfo').textContent =
        `${params.toolName}\n${JSON.stringify(params.arguments, null, 2)}`;
      document.getElementById('approvalModal').classList.remove('hidden');
    }

    async function resolveApproval(approved) {
      if (!pendingApprovalId) return;
      await rpc('approval/resolve', { id: pendingApprovalId, approved });
      pendingApprovalId = null;
      document.getElementById('approvalModal').classList.add('hidden');
    }

    // ── Init ──
    document.getElementById('sidebarToggle').onclick = () => {
      document.querySelector('.app').classList.toggle('sidebar-hidden');
    };
    if (innerWidth < 860) document.querySelector('.app').classList.add('sidebar-hidden');
    updateComposerState();
    connect();
  </script>
