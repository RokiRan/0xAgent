<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>TETRIS</h1>
        </header>

        <div class="game-main">
            <div class="side-panel left-panel">
                <div class="info-box">
                    <h2>SCORE</h2>
                    <div id="score">0</div>
                </div>
                <div class="info-box">
                    <h2>LEVEL</h2>
                    <div id="level">1</div>
                </div>
                <div class="info-box">
                    <h2>LINES</h2>
                    <div id="lines">0</div>
                </div>
            </div>

            <div class="board-container">
                <canvas id="game-board" width="300" height="600"></canvas>
                <div id="game-overlay" class="overlay hidden">
                    <div class="overlay-content">
                        <h2 id="overlay-title">PAUSED</h2>
                        <p id="overlay-message">Press P to resume</p>
                        <button id="overlay-button" class="btn">START</button>
                    </div>
                </div>
            </div>

            <div class="side-panel right-panel">
                <div class="info-box">
                    <h2>NEXT</h2>
                    <canvas id="next-piece" width="120" height="120"></canvas>
                </div>
                <div class="info-box controls-info">
                    <h2>CONTROLS</h2>
                    <ul>
                        <li><span class="key">&larr; &rarr;</span> Move</li>
                        <li><span class="key">&darr;</span> Soft Drop</li>
                        <li><span class="key">&uarr;</span> Rotate</li>
                        <li><span class="key">SPACE</span> Hard Drop</li>
                        <li><span class="key">P</span> Pause</li>
                        <li><span class="key">R</span> Restart</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
